[package]
name = "tiletangle-engine-ffi"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "C ABI for TileTangle engine"

[lib]
name = "tiletangle_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
engine = { package = "tiletangle-engine", path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

