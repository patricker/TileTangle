repos:
  - repo: local
    hooks:
      - id: fmt
        name: rustfmt
        entry: bash -c 'cargo fmt --all && cargo fmt --all -- --check'
        language: system
        files: '\\.(rs|toml)$'
        pass_filenames: false
      - id: clippy
        name: clippy
        entry: bash -c 'cargo clippy --workspace --all-targets --all-features -- -D warnings'
        language: system
        files: '\\.rs$'
        pass_filenames: false
