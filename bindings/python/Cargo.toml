[package]
name = "tiletangle-python"
version = "0.2.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[lib]
name = "tiletangle"
crate-type = ["cdylib"]

[dependencies]
engine = { package = "tiletangle-engine", path = "../../engine" }
pyo3 = { version = "=0.24.1", features = ["extension-module", "abi3-py38"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
