[package]
name = "tiletangle-python"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "tiletangle"
crate-type = ["cdylib"]

[dependencies]
engine = { package = "tiletangle-engine", path = "../../engine" }
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py38"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

