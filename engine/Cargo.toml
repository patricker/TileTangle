[package]
name = "tiletangle-engine"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Core engine for universal, configurable word-game logic"
repository = "https://example.com/TileTangle" 
keywords = ["games", "word", "engine"]
categories = ["game-engines"]

[lib]
name = "engine"
path = "src/lib.rs"

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
unicode-normalization = "0.1"
smallvec = "1"
rand = { version = "0.8", features = ["std_rng"] }
rand_chacha = "0.3"

[dev-dependencies]
