[package]
name = "tiletangle-engine"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Core engine for universal, configurable word-game logic"
repository = "https://example.com/TileTangle"
readme = "../README.md"
documentation = "https://example.com/TileTangle/docs/install"
keywords = ["games", "word", "engine"]
categories = ["game-engines"]

[lib]
name = "engine"
path = "src/lib.rs"

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
unicode-normalization = "0.1"
smallvec = "1"
rand = { version = "0.8", features = ["std_rng", "serde1"] }
rand_chacha = { version = "0.3", features = ["serde1"] }
fst = "0.4"
serde_json = "1"
unicode-segmentation = "1"
ciborium = { version = "0.2", default-features = true }
rayon = { version = "1", optional = true }
wide = { version = "0.7", optional = true }
flate2 = { version = "1", features = ["rust_backend"], default-features = false }
zstd = { version = "0.13", default-features = true, optional = true }

[features]
default = []
parallel = ["rayon"]
simd = ["wide"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }


[[bench]]
name = "core"
harness = false

[[bench]]
name = "dict_engines"
harness = false

[[bench]]
name = "movegen_graph"
harness = false


[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
