[package]
name = "tiletangle-engine"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Core engine for universal, configurable word-game logic"
repository = "https://example.com/TileTangle" 
keywords = ["games", "word", "engine"]
categories = ["game-engines"]

[lib]
name = "engine"
path = "src/lib.rs"

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
unicode-normalization = "0.1"
smallvec = "1"
rand = { version = "0.8", features = ["std_rng", "serde1"] }
rand_chacha = { version = "0.3", features = ["serde1"] }
fst = "0.4"
serde_json = "1"
unicode-segmentation = "1"
serde_cbor = "0.11"
rayon = { version = "1", optional = true }

[features]
default = []
parallel = ["rayon"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }


[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
