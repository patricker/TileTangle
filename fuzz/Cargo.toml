[package]
name = "tiletangle-fuzz"
version = "0.0.1"
edition = "2024"
publish = false

[workspace]
members = ["."]
resolver = "2"

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
serde_json = "1"
tiletangle-engine = { path = "../engine" }

[build-dependencies]
cc = "1"

[profile.release]
debug = 1

[[bin]]
name = "fuzz_config_load"
path = "src/bin/fuzz_config_load.rs"

[[bin]]
name = "fuzz_move_draft"
path = "src/bin/fuzz_move_draft.rs"
