[package]
name = "tiletangle-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiletangle-engine = { path = "../engine" }

[dev-dependencies]
wasm-bindgen-test = "0.3"

