name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build (exclude Python crate)
        run: cargo build --workspace --all-features --exclude tiletangle-python
      - name: Test (exclude Python crate)
        run: cargo test --workspace --all-features --exclude tiletangle-python
      - name: Clippy (core crates only)
        run: |
          cargo clippy --all-targets --all-features \
            -p tiletangle-engine \
            -p tiletangle-engine-ffi \
            -p tiletangle-wasm \
            -p tiletangle-godot \
            -p tiletangle-plugin-template \
            -p dict-build \
            -- -D warnings
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Generate C header (cbindgen)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cbindgen --locked
          cd engine_ffi && mkdir -p include && cbindgen --config cbindgen.toml --crate tiletangle-engine-ffi --output include/engine.h
      - name: C smoke test (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          gcc -v
          cargo build -p tiletangle-engine-ffi
          gcc engine_ffi/tests/smoke.c -I engine_ffi/include -L target/debug -l tiletangle_ffi -o /tmp/ffi_smoke
          export LD_LIBRARY_PATH=$PWD/target/debug:$LD_LIBRARY_PATH
          /tmp/ffi_smoke
      - name: Build FFI (release)
        run: cargo build -p tiletangle-engine-ffi --release
      - name: Upload FFI artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ffi-linux-${{ matrix.toolchain }}
          path: target/release/libtiletangle_ffi.so
      - name: Upload FFI artifact (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ffi-macos-${{ matrix.toolchain }}
          path: target/release/libtiletangle_ffi.dylib
      - name: Upload FFI artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ffi-windows-msvc-${{ matrix.toolchain }}
          path: target\release\tiletangle_ffi.dll
      - name: Upload C header (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ffi-header
          path: engine_ffi/include/engine.h
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build wasm (nodejs target)
        run: |
          cd wasm
          wasm-pack build --target nodejs --out-dir pkg-node
      - name: Run WASM smoke test (Node)
        run: node wasm/ci_smoke.mjs
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: License and advisory checks
        run: cargo deny check --hide-inclusion-graph
      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked
      - name: Install nightly toolchain for udeps
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - name: Unused dependencies check
        run: cargo +nightly udeps --workspace --all-targets

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install maturin and pytest
        run: python -m pip install --upgrade pip maturin pytest
      - name: Build Python extension (develop)
        run: |
          cd bindings/python
          maturin develop --release
      - name: Python smoke test
        run: |
          python - << 'PY'
          import json
          from tiletangle import Game
          cfg = {
              "tileset": {"tile_kinds": [
                  {"id": "A", "symbol": "A", "score": 1},
                  {"id": "B", "symbol": "B", "score": 3},
              ]},
              "rack_size": 7,
              "board_layout": {"width": 5, "height": 5},
              "ruleset_id": "cross",
              "dictionary_id": "en",
              "rng_seed": 42,
              "tile_counts": {"A": 10, "B": 10},
              "free_word_mode": True,
          }
          g = Game(json.dumps(cfg), 2)
          b = json.loads(g.get_board_json())
          assert b['width'] == 5 and b['height'] == 5
          sc = g.play_move(json.dumps([
              {"x": 2, "y": 2, "kind_id": "A"},
              {"x": 3, "y": 2, "kind_id": "B"},
          ]))
          assert sc['total'] >= 0
          print('Python smoke OK')
          PY
  python-wheels:
    name: Build Python wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Linux manylinux wheels
        if: matrix.os == 'ubuntu-latest'
        uses: messense/maturin-action@v1
        with:
          manylinux: auto
          args: --release -m bindings/python/Cargo.toml -o dist
      - name: macOS/Windows wheels
        if: matrix.os != 'ubuntu-latest'
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release -m bindings/python/Cargo.toml -o dist
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}
          path: dist/*
      - name: Run Python pytest
        run: |
          pip install pytest
          pytest -q bindings/python/tests

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Run Criterion benchmarks
        run: cargo bench -p tiletangle-engine
      - name: Compare against baseline
        run: python3 tools/report_bench.py --baseline bench/baselines/main.json

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz config loader (smoke)
        run: cargo +nightly fuzz run fuzz_config_load -- -max_total_time=20 -verbosity=0
      - name: Fuzz move draft (smoke)
        run: cargo +nightly fuzz run fuzz_move_draft -- -max_total_time=20 -verbosity=0
